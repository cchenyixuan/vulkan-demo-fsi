schema_version: 2

# 2D Taylor-Couette (circular Couette) — rotor validation case.
# GENERATED by utils/geometry/_demo_taylor_couette_2d.py.
#   inner cylinder r_i = 0.05 rotates at Omega = 2.0 rad/s (ROTOR kind),
#   outer cylinder r_o = 0.1 static (BOUNDARY kind), gap 0.05 m, dx = 0.001
#   fluid 23,096 / wall 3,504 / rotor 1,660
# Analytic steady profile: u_theta = A r + B / r with
#   A = Omega r_i^2 / (r_i^2 - r_o^2), B = -A r_o^2.

time:
  total: null
  max_steps: null
  output_cadence: null

physics:
  dimension: 2
  h: 0.005000
  particle_radius: 0.000500
  lattice: grid
  calibrate_volume: true
  speed_of_sound: 4.0
  power: 7
  cfl: 0.15
  gravity: [0.0, 0.0, 0.0]

numerics:
  use_density_diffusion: true
  delta_coefficient: 0.1
  use_kcg_correction: true
  regularization:
    xi: 0.1
    det_threshold: 1.0e-4
    frobenius_max: 10.0
  use_pst: true
  pst_main: 0.1
  pst_anti: 0.0005
  defrag_enabled: true
  defrag_cadence: 1000
  use_prefix_sum_defrag: false

capacities:
  pool_size: 32512
  max_per_voxel: 96
  max_incoming: 16
  workgroup: 128

material_library: materials.yaml

rotor:
  axis: [0.0, 0.0, 1.0]
  pivot: [0.0, 0.0, 0.0]
  ramp_time: 0.1

geometry:
  frame: frame.obj
  particles:
    - {file: fluid.obj, material: couette_fluid}
    - {file: wall.obj,  material: couette_wall}
    - {file: rotor.obj, material: couette_rotor}
