schema_version: 1

# Case-local material library for the 30 L stirred tank.
tank_water:
  kind: fluid
  rest_density: 998.0
  viscosity: 1.0e-6

tank_wall:
  kind: boundary
  rest_density: 998.0
  viscosity: 1.0e-6

impeller:
  kind: rotor
  rest_density: 998.0
  viscosity: 1.0e-6
  rotor_angular_velocity: 20.94395   # rad/s, magnitude of -200 rpm about +y (axis handling TBD in solver)
