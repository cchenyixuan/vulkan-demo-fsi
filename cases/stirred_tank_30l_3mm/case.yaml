schema_version: 2

# 30 L stirred tank (Rautenbach et al. 2026 dataset geometry), 3D.
# GENERATED by utils/geometry/_demo_stirred_tank_30l.py.
#   dx = 0.003000 m, h = 0.009000 m (h/dx = 3), thin parts >= 3 layers
#   fluid 982,620 / wall 250,852 / rotor 7,785
# Flat lid at y = 0.4265 (no free surface), gravity off: with a closed
# single-phase tank gravity only adds a hydrostatic offset, so c0 is set from
# the impeller tip speed only (10 * 1.028 m/s).
# Rotor: shaft + both impellers rotate rigidly about +y through the origin
# (predict.comp ROTOR branch, 2026-09-25). M-Star's -200 rpm about +y is
# counter-clockwise seen from above (M-Star: positive RPM = clockwise looking
# along gravity), i.e. a POSITIVE right-hand angular velocity about +y
# (+20.944 rad/s in materials.yaml); the PBT then pumps DOWN. The sign was
# fixed on 2026-09-26 (log/2026-09-26_rotor-direction-fix.md); this comment
# was corrected on 2026-09-27.
# NOTE: this committed case is the 2026-09-25 baseline: FLAT bottom at y = 0
# and c0 = 10 U_tip. Current runs regenerate the case with the generator
# (dished bottom since 5abaed8) and --c0-factor 20
# (log/2026-09-25_np-campaign.md, log/2026-09-26_dished-bottom.md).

time:
  total: null
  max_steps: null
  output_cadence: null

physics:
  dimension: 3
  h: 0.009000
  particle_radius: 0.001500
  lattice: grid
  calibrate_volume: true
  speed_of_sound: 10.283
  power: 7
  cfl: 0.15
  gravity: [0.0, 0.0, 0.0]

numerics:
  use_density_diffusion: true
  delta_coefficient: 0.1
  use_kcg_correction: true
  regularization:
    xi: 0.01      # 0.1 until 2026-09-28: it made (M + xi I)^-1 about 8 % too small (log/2026-09-28_kcg-xi-0p01.md)
    det_threshold: 1.0e-4
    frobenius_max: 10.0
  use_pst: true
  pst_main: 0.1
  pst_anti: 0.0005
  defrag_enabled: true
  defrag_cadence: 10
  use_prefix_sum_defrag: false

capacities:
  pool_size: 1427456
  max_per_voxel: 64
  max_incoming: 32
  workgroup: 128

material_library: materials.yaml

rotor:
  axis: [0.0, 1.0, 0.0]
  pivot: [0.0, 0.0, 0.0]
  ramp_time: 0.0500      # s, linear spin-up (M-Star used 0.0092 s)

geometry:
  frame: frame.obj
  particles:
    - {file: fluid.obj, material: tank_water}
    - {file: wall.obj,  material: tank_wall}
    - {file: rotor.obj, material: impeller}
