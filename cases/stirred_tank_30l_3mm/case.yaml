schema_version: 2

# 30 L stirred tank (Rautenbach et al. 2026 dataset geometry), 3D.
# GENERATED by utils/geometry/_demo_stirred_tank_30l.py.
#   dx = 0.003000 m, h = 0.009000 m (h/dx = 3), thin parts >= 3 layers
#   fluid 982,620 / wall 250,852 / rotor 7,785
# Flat lid at y = 0.4265 (no free surface), gravity off: with a closed
# single-phase tank gravity only adds a hydrostatic offset, so c0 is set from
# the impeller tip speed only (10 * 1.028 m/s).
# NOTE: rotor motion is not implemented in the solver yet; with the current
# code the impeller is a static body (geometry / stability check only).

time:
  total: null
  max_steps: null
  output_cadence: null

physics:
  dimension: 3
  h: 0.009000
  particle_radius: 0.001500
  lattice: grid
  calibrate_volume: true
  speed_of_sound: 10.283
  power: 7
  cfl: 0.15
  gravity: [0.0, 0.0, 0.0]

numerics:
  use_density_diffusion: true
  delta_coefficient: 0.1
  use_kcg_correction: true
  regularization:
    xi: 0.1
    det_threshold: 1.0e-4
    frobenius_max: 10.0
  use_pst: true
  pst_main: 0.1
  pst_anti: 0.0005
  defrag_enabled: true
  defrag_cadence: 1000
  use_prefix_sum_defrag: false

capacities:
  pool_size: 1427456
  max_per_voxel: 64
  max_incoming: 32
  workgroup: 128

material_library: materials.yaml

geometry:
  frame: frame.obj
  particles:
    - {file: fluid.obj, material: tank_water}
    - {file: wall.obj,  material: tank_wall}
    - {file: rotor.obj, material: impeller}
